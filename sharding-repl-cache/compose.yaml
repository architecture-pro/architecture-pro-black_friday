name: sharding-repl-cache

services:
  pymongo_api:
    build:
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      mongos_router:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      MONGODB_URL: 'mongodb://mongos_router:27020'
      MONGODB_DATABASE_NAME: 'somedb'
      REDIS_URL: 'redis://redis:6379'

  # сервер конфигурации
  configSrv:
    image: mongo:latest
    restart: always
    command: [
        '--configsvr', # запуск в режиме конфигурации
        '--replSet',
        'config_server',
        '--bind_ip_all',
        '--port',
        '27017',
      ]
    volumes:
      - config-data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--port',
          '27017',
          '--quiet',
          '--eval',
          "db.adminCommand('ping')",
        ]
      interval: 5s
      start_period: 10s

  # 1-й шард
  shard1:
    image: mongo:latest
    restart: always
    command: [
        '--shardsvr', # запуск в режиме шардинга
        '--replSet',
        'shard1', # название реплики
        '--bind_ip_all',
        '--port',
        '27018',
      ]
    volumes:
      - shard1-data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--port',
          '27018',
          '--quiet',
          '--eval',
          "db.adminCommand('ping')",
        ]
      interval: 5s
      start_period: 10s

  # реплика
  shard1-replica1:
    image: mongo:latest
    command: mongod --shardsvr --replSet shard1 --bind_ip_all --port 27018
    volumes:
      - shard1-replica1-data:/data/db
    depends_on:
      - shard1

  # реплика
  shard1-replica2:
    image: mongo:latest
    command: mongod --shardsvr --replSet shard1 --bind_ip_all --port 27018
    volumes:
      - shard1-replica2-data:/data/db
    depends_on:
      - shard1

  # 2-й шард
  shard2:
    image: mongo:latest
    restart: always
    command:
      ['--shardsvr', '--replSet', 'shard2', '--bind_ip_all', '--port', '27019']
    volumes:
      - shard2-data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--port',
          '27019',
          '--quiet',
          '--eval',
          "db.adminCommand('ping')",
        ]
      interval: 5s
      start_period: 10s

  # реплика
  shard2-replica1:
    image: mongo:latest
    command: mongod --shardsvr --replSet shard2 --bind_ip_all --port 27019
    volumes:
      - shard2-replica1-data:/data/db
    depends_on:
      - shard2

  # реплика
  shard2-replica2:
    image: mongo:latest
    command: mongod --shardsvr --replSet shard2 --bind_ip_all --port 27019
    volumes:
      - shard2-replica2-data:/data/db
    depends_on:
      - shard2

  # роутер
  mongos_router:
    image: mongo:latest
    restart: always
    command: [
        'mongos', # обычная mongo в режиме роутера
        '--configdb',
        'config_server/configSrv:27017', # передача данных сервера конфигурации
        '--bind_ip_all',
        '--port',
        '27020',
      ]
    depends_on:
      configSrv:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--port',
          '27020',
          '--quiet',
          '--eval',
          "db.adminCommand('ping')",
        ]
      interval: 5s
      start_period: 10s

  # кэш
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  config-data:
  shard1-data:
  shard2-data:
  shard1-replica1-data:
  shard1-replica2-data:
  shard2-replica1-data:
  shard2-replica2-data:
  redis-data:
