name: mongo-sharding

services:
  pymongo_api:
    build:
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos_router
    ports:
      - '8080:8080'
    environment:
      MONGODB_URL: 'mongodb://mongos_router:27020'
      MONGODB_DATABASE_NAME: 'somedb'

  # сервер конфигурации
  configSrv:
    image: mongo:latest
    container_name: configSrv
    restart: always
    command: [
        '--configsvr', # запуск в режиме конфигурации
        '--replSet',
        'config_server',
        '--bind_ip_all',
        '--port',
        '27017',
      ]
    volumes:
      - config-data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--port',
          '27017',
          '--quiet',
          '--eval',
          "db.adminCommand('ping')",
        ]
      interval: 5s
      start_period: 10s

  # 1-й шард
  shard1:
    image: mongo:latest
    container_name: shard1
    restart: always
    command: [
        '--shardsvr', # запуск в режиме шардинга
        '--replSet',
        'shard1', # название реплики
        '--bind_ip_all',
        '--port',
        '27018',
      ]
    volumes:
      - shard1-data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--port',
          '27018',
          '--quiet',
          '--eval',
          "db.adminCommand('ping')",
        ]
      interval: 5s
      start_period: 10s

  # 2-й шард
  shard2:
    image: mongo:latest
    container_name: shard2
    restart: always
    command:
      ['--shardsvr', '--replSet', 'shard2', '--bind_ip_all', '--port', '27019']
    volumes:
      - shard2-data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--port',
          '27019',
          '--quiet',
          '--eval',
          "db.adminCommand('ping')",
        ]
      interval: 5s
      start_period: 10s

  # роутер
  mongos_router:
    image: mongo:latest
    container_name: mongos_router
    restart: always
    command: [
        'mongos', # обычная mongo в режиме роутера
        '--configdb',
        'config_server/configSrv:27017', # передача данных сервера конфигурации
        '--bind_ip_all',
        '--port',
        '27020',
      ]
    depends_on:
      configSrv:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--port',
          '27020',
          '--quiet',
          '--eval',
          "db.adminCommand('ping')",
        ]
      interval: 5s
      start_period: 10s

volumes:
  config-data:
  shard1-data:
  shard2-data:
